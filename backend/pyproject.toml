[project]
name = "py-hex-aied-2"
version = "0.1.0"
description = "Add your description here"
readme = "../README.md"
requires-python = ">=3.14"
dependencies = [
    "aiokafka==0.14.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.140.1",
    "greenlet>=3.5.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "N", "ANN"]

[tool.mypy]
python_version = "3.14"
strict = true
